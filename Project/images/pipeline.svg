<svg width="990" height="1460" viewBox="0 0 990 1460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Manual/User-Initiated Steps -->
  <rect x="320" y="20" width="350" height="50" rx="10" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="495" y="44" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#1e3a8a">
    <tspan x="495" dy="0">Dataset Creation</tspan>
    <tspan x="495" dy="1.3em">(Manual/User-Initiated)</tspan>
  </text>
  <rect x="320" y="90" width="350" height="50" rx="10" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="495" y="114" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#1e3a8a">
    <tspan x="495" dy="0">Ground Truth Labeling</tspan>
    <tspan x="495" dy="1.3em">(Manual/User-Initiated)</tspan>
  </text>
  <rect x="320" y="160" width="350" height="50" rx="10" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="495" y="184" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#1e3a8a">
    <tspan x="495" dy="0">Startup / Initial Setup</tspan>
    <tspan x="495" dy="1.3em">(Manual/User-Initiated)</tspan>
  </text>
  <!-- Data Processing -->
  <rect x="320" y="230" width="350" height="50" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="495" y="260" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#00695c">Clean Outputs</text>
  <rect x="320" y="300" width="350" height="50" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="495" y="330" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#00695c">Initialize Dask Client</text>
  <rect x="320" y="370" width="350" height="50" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="495" y="400" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#00695c">Load Dataset</text>
  <rect x="320" y="440" width="350" height="50" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="495" y="470" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#00695c">Column Mapping</text>
  <rect x="320" y="510" width="350" height="50" rx="10" fill="#f5f5dc" stroke="#bc6c25" stroke-width="2"/>
  <text x="495" y="530" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#bc6c25">
    <tspan x="495" dy="0">Predict Final Reputations on Raw Data</tspan>
    <tspan x="495" dy="1.3em">(TPOT, FLAML)</tspan>
  </text>
  <rect x="320" y="580" width="350" height="50" rx="10" fill="#f1f8e9" stroke="#388e3c" stroke-width="2"/>
  <text x="495" y="610" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#388e3c">Process Outliers</text>
  <!-- Split Paths -->
  <rect x="120" y="670" width="260" height="50" rx="10" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
  <text x="250" y="700" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#3730a3">Normal Data</text>
  <rect x="620" y="670" width="250" height="50" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="745" y="700" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#831843">Misbehaving Data</text>
  <rect x="620" y="740" width="250" height="50" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="745" y="770" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#c2410c">Split Misbehaving</text>
  <rect x="530" y="810" width="170" height="50" rx="10" fill="#fef9c3" stroke="#b45309" stroke-width="2"/>
  <text x="615" y="840" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#78350f">Intentional Data</text>
  <rect x="770" y="810" width="170" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="855" y="840" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#991b1b">Unintentional Data</text>
  <!-- Merge Paths to Feedback -->
  <line x1="250" y1="720" x2="250" y2="890" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="615" y1="860" x2="615" y2="890" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="855" y1="860" x2="855" y2="890" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="495" cy="890" r="8" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="250" y1="890" x2="495" y2="890" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="615" y1="890" x2="495" y2="890" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="855" y1="890" x2="495" y2="890" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="495" y1="898" x2="495" y2="920" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Unsupervised Feedback -->
  <rect x="320" y="920" width="350" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="495" y="942" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#5b21b6">
    <tspan x="495" dy="0">Feedback Loop (Unsupervised)</tspan>
    <tspan x="495" dy="1.3em">Input: Normal, Intentional, Unintentional</tspan>
  </text>
  <rect x="320" y="1000" width="350" height="50" rx="10" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="495" y="1022" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#5b21b6">
    <tspan x="495" dy="0">Predict Final Reputations on Processed Data</tspan>
    <tspan x="495" dy="1.3em">(Unsupervised)</tspan>
  </text>
  <!-- Supervised Feedback -->
  <rect x="320" y="1150" width="350" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="495" y="1172" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#991b1b">
    <tspan x="495" dy="0">Feedback Loop (Supervised)</tspan>
    <tspan x="495" dy="1.3em">Input: Normal, Intentional, Unintentional</tspan>
  </text>
  <!-- ΝΕΟ: Ground Truth (ίδιο style με το Load Dataset) -->
  <rect x="320" y="1080" width="350" height="50" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="495" y="1110" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#00695c">Ground Truth</text>
  <!-- Predict Final Reputations on Processed Data (Supervised) -->
  <rect x="320" y="1230" width="350" height="50" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="495" y="1252" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#991b1b">
    <tspan x="495" dy="0">Predict Final Reputations on Processed Data</tspan>
    <tspan x="495" dy="1.3em">(Supervised)</tspan>
  </text>
  <!-- Visualization & End -->
  <rect x="320" y="1310" width="350" height="50" rx="10" fill="#e0e7ef" stroke="#64748b" stroke-width="2"/>
  <text x="495" y="1340" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#334155">Generate Visualizations</text>
  <rect x="320" y="1380" width="350" height="50" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="495" y="1410" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#334155">Cleanup &amp; End</text>
  <!-- Vertical arrows between blocks -->
  <g stroke="#222" stroke-width="2" marker-end="url(#arrow)">
    <line x1="495" y1="70" x2="495" y2="90"/>
    <line x1="495" y1="140" x2="495" y2="160"/>
    <line x1="495" y1="210" x2="495" y2="230"/>
    <line x1="495" y1="280" x2="495" y2="300"/>
    <line x1="495" y1="350" x2="495" y2="370"/>
    <line x1="495" y1="420" x2="495" y2="440"/>
    <line x1="495" y1="490" x2="495" y2="510"/>
    <line x1="495" y1="560" x2="495" y2="580"/>
    <line x1="495" y1="630" x2="250" y2="670"/>
    <line x1="495" y1="630" x2="745" y2="670"/>
    <line x1="745" y1="720" x2="745" y2="740"/>
    <line x1="745" y1="790" x2="615" y2="810"/>
    <line x1="745" y1="790" x2="855" y2="810"/>
    <line x1="250" y1="720" x2="250" y2="890"/>
    <line x1="615" y1="860" x2="615" y2="890"/>
    <line x1="855" y1="860" x2="855" y2="890"/>
    <line x1="250" y1="890" x2="495" y2="890"/>
    <line x1="615" y1="890" x2="495" y2="890"/>
    <line x1="855" y1="890" x2="495" y2="890"/>
    <line x1="495" y1="898" x2="495" y2="920"/>
    <!-- Predict Final Reputations on Processed Data (Unsupervised) → Ground Truth -->
    <line x1="495" y1="1050" x2="495" y2="1080"/>
    <!-- Ground Truth → Feedback Loop (Supervised) -->
    <line x1="495" y1="1130" x2="495" y2="1150"/>
    <!-- Feedback Loop (Supervised) → Predict Final Reputations on Processed Data (Supervised) -->
    <line x1="495" y1="1210" x2="495" y2="1230"/>
    <!-- Predict Final Reputations on Processed Data (Supervised) → Generate Visualizations -->
    <line x1="495" y1="1280" x2="495" y2="1310"/>
    <!-- Generate Visualizations → Cleanup & End -->
    <line x1="495" y1="1360" x2="495" y2="1380"/>
    <line x1="495" y1="1360" x2="495" y2="1380"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 L6,6 L2,2" style="fill:#222;" />
    </marker>
  </defs>
</svg>